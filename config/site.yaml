# ─── EDU-PUBLISH Site Configuration ───
# This is the single source of truth for all site-level branding.
# Change these values to customize the site for your university.

# === Basic Info ===
site_name: "湖南大学通知聚合"
site_short_name: "湖大通知"
site_description: "湖南大学文学院及公共课通知聚合站"
site_url: "https://example.edu.cn"
default_locale: "zh-CN"

# === Organization ===
organization_name: "湖南大学文学院"
organization_type: "university"
organization_unit_label: "单位"

# === Brand Assets ===
logo_light: "/icon.svg"
logo_dark: "/icon.svg"
favicon: "/icon.svg"
default_cover: "/img/default-cover.svg"

# === Footer ===
footer:
  copyright: "© 2026 湖南大学文学院"
  links:
    - label: "GitHub"
      url: "https://github.com/RFdLCJzl/EDU-PUBLISH"
    - label: "反馈"
      url: "https://github.com/RFdLCJzl/EDU-PUBLISH/issues"

# === SEO ===
seo:
  title_template: "{page} - {site_name}"
  default_keywords:
    - 湖南大学
    - 文学院
    - 高校通知
    - 校园信息

# === Automation ===
# Set to false if this repo should not deploy through GitHub Actions.
github_actions_enabled: false

# === Palette ===
palette:
  preset: "blue"
  primary: null
  secondary: null
  accent: null
